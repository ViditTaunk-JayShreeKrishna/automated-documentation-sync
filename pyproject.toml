[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "automated-documentation-sync"
version = "0.1.0"
description = "Python service foundation for Automated Documentation Sync"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "python-dotenv>=1.0,<2",
    "SQLAlchemy>=2,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
docsync-api = "docsync.api:main"
docsync-worker = "docsync.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docsync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
